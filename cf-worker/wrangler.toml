# 珠峰冰坡雷达监测 Worker。部署：Cloudflare 后台 Workers 和 Pages → 导入本仓库（根目录 cf-worker，生产分支 main）。
name = "everest-facets"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true             # 开启 everest-facets.<子域>.workers.dev 网址

[triggers]
crons = ["* * * * *"]          # 每分钟一次（UTC）；每次最多 40 个请求给微软

[[d1_databases]]
binding = "DB"
database_name = "everest-facets"
database_id = "b9e8c8c3-1395-4b7d-85a1-3c707004c87e"   # Cloudflare D1：everest-facets

[vars]
GH_REPO = "Yizebaba/everest-insar-pipeline"   # 结果推到这个仓库的 facet-live 分支（需另配 GH_TOKEN 密钥，可选）
GH_BRANCH = "facet-live"
GH_BASE = "main"

[observability]
enabled = true
