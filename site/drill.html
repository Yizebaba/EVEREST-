<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EVEREST 推演</title>
<meta name="description" content="用 EVEREST 的真实数据做种子，按你自己写的要求运行 群体智能推演。">
<style>
:root{--bg:#0a0b0c;--panel:rgba(18,18,22,.86);--line:rgba(255,255,255,.1);--ink:#ececf0;--mute:#8d8f99;--amber:#ffb347;--ok:#5fe0a8;--bad:#ff7a6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{background:radial-gradient(80% 60% at 70% 10%,rgba(255,179,71,.08),transparent 60%),var(--bg);min-height:100vh}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
header b{letter-spacing:.14em}
header small{color:var(--mute)}
header nav{margin-left:auto;display:flex;gap:8px}
header nav a{padding:4px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;text-decoration:none}
main{max-width:860px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:24px;margin:6px 0 6px}
.lead{color:var(--mute);margin:0 0 18px;max-width:46em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
label{display:block;font-size:12.5px;margin:12px 0 5px;color:#d8d6cf}
textarea,input[type=text],input[type=password],input[type=number]{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);outline:none}
textarea{min-height:160px;resize:vertical;line-height:1.6}
textarea:focus,input:focus{border-color:var(--amber)}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.btn{padding:9px 18px;border-radius:10px;border:1px solid var(--amber);background:var(--amber);color:#1a1205;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;color:var(--amber)}
.link{border:0;background:none;color:var(--amber);cursor:pointer;padding:0;font-size:12.5px}
.mute{color:var(--mute)}.small{font-size:12.5px}
.msg{margin-top:10px;font-size:13px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.run{padding:11px 0;border-top:1px solid var(--line)}.run:first-child{border-top:0}
.st{font-size:11.5px;padding:1px 8px;border-radius:999px;margin-left:6px}
.md{line-height:1.75}.md h1{font-size:20px}.md h2{font-size:17px}.md a{color:#8fd3ff}
.md table{border-collapse:collapse;font-size:12px}.md td,.md th{border:1px solid var(--line);padding:4px 6px}
ul.seed{margin:6px 0 0;padding-left:18px;color:#cfcdc6;font-size:13px}
@media (max-width:640px){.g2{grid-template-columns:1fr}header small{display:none}}
</style>
</head>
<body>
<header><b>EVEREST</b><small>推演</small><nav><a href="https://claude.ai/artifact/6heopu2wizEAFMJJLDs44H" target="_blank" rel="noopener">总览 ↗</a><a href="https://yizebaba.github.io/BRI-Full-Scope-Foresight/" target="_blank" rel="noopener">一带一路 ↗</a><a href="https://github.com/Yizebaba/EVEREST-" target="_blank" rel="noopener">GitHub ↗</a></nav></header>
<main id="main">
<h1>群体智能推演</h1>
<p class="lead">你写推演要求，系统用 EVEREST 的真实数据自动生成种子材料（证据包、灾种扫描、实时采集、运行记录），连同你的要求一起上传给推演引擎：建知识图谱、生成智能体、模拟，最后写出报告。一次约 1 小时。推演结果单独保存并标注为推演，不进证据链。</p>
<div id="app"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script>
"use strict";
const REPO="Yizebaba/EVEREST-",RAW="https://raw.githubusercontent.com/"+REPO+"/events/",WF="mirofish.yml";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bj=t=>{if(!t)return"—";const d=new Date(t);return isNaN(d)?esc(t):d.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let RUNS=[],LIVE=[],VIEW=null;
function form(){const tok=(ls.get("gh_token")||ls.get("ev_gh_token"));
 return'<div class="card"><form id="df" autocomplete="off"><label for="req">推演要求（必填，由你自己写）</label><textarea id="req" required minlength="10" placeholder="写清楚想推演的事件、对象和关心的问题。">'+esc(ls.get("ev_draft")||"")+'</textarea>'
 +'<div class="g2"><div><label for="title">标题（可空）</label><input id="title" type="text" maxlength="60"></div><div><label for="rounds">模拟轮数</label><input id="rounds" type="number" min="5" max="80" value="20"></div></div>'
 +'<label>将自动生成并上传的种子材料</label><ul class="seed"><li>平台概况和运行记录</li><li>证据包事件档案（多源时间线、存证）</li><li>281 种灾害的实测覆盖和最近扫描</li><li>实时采集：水位、地震、通信、DORIS、坡面分级</li><li>外部数据库和生态目录</li></ul>'
 +'<div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" id="go" type="submit"'+(tok?"":" disabled")+'>开始推演</button>'+(tok?'<span class="small mute">已在本浏览器连接 GitHub · <button type="button" class="link" data-a="tok:clear">断开</button></span>':'<span class="small mute">先在下面连接 GitHub</span>')+'</div><div class="msg" id="msg"></div></form>'
 +(tok?"":'<label style="margin-top:18px">连接 GitHub（只需一次）</label><p class="small mute" style="margin:0">开始推演要用你的 GitHub 令牌触发仓库里的推演工作流。令牌只存在这个浏览器里。在 GitHub → Settings → Developer settings → Fine-grained tokens 新建：Repository access 选 EVEREST-，Permissions 里 Actions 选 Read and write。一带一路的推演也用这一个令牌，在同一个浏览器里只需连接一次。</p><div style="display:flex;gap:8px;margin-top:8px"><input id="tok" type="password" placeholder="github_pat_…" style="flex:1"><button class="btn ghost" type="button" data-a="tok:save">保存</button></div>')+'</div>'}
function runsInner(){const st={queued:["排队中","#f2c14e"],in_progress:["运行中","#8fd3ff"]};
 let h=LIVE.filter(r=>r.status!=="completed").map(r=>'<div class="run"><b>'+esc(r.display_title)+'</b><span class="st" style="background:'+st[r.status][1]+'22;color:'+st[r.status][1]+'">'+st[r.status][0]+'</span><div class="small mute">开始于 '+bj(r.run_started_at||r.created_at)+' · <a href="'+esc(r.html_url)+'" target="_blank" rel="noopener">运行日志 ↗</a></div></div>').join("");
 h+=RUNS.map(r=>'<div class="run"><b>'+esc(r.title||r.dir.split("/").pop())+'</b><span class="st" style="background:'+(r.ok?"#5fe0a822":"#ff7a6b22")+';color:'+(r.ok?"#5fe0a8":"#ff7a6b")+'">'+(r.ok?"完成":r.ok===false?"失败":"未完成")+'</span><div class="small mute">'+bj(r.started)+(r.error?" · "+esc(r.error):"")+'</div>'+(r.requirement?'<div class="small" style="margin-top:4px;color:#cfcdc6">'+esc(r.requirement)+'</div>':"")+'<div class="small" style="margin-top:4px">'+(r.has_report?'<button class="link" data-a="rep:'+esc(r.dir)+'">看报告</button> · ':"")+(r.run_url?'<a class="mute" href="'+esc(r.run_url)+'" target="_blank" rel="noopener">运行日志 ↗</a>':"")+'</div></div>').join("");
 return h||'<p class="small mute">还没有推演。</p>'}
const runs=()=>'<div class="card"><b>推演记录</b><div id="runs">'+runsInner()+'</div></div>';
function render(){if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#df"))return;
 document.getElementById("app").innerHTML=VIEW?'<div class="card"><button class="link" data-a="back:1">← 返回</button><div class="md">'+VIEW+'</div></div>':form()+runs()}
async function loadRuns(){try{const r=await fetch(RAW+"mirofish/index.json?v="+Math.floor(Date.now()/60000));if(r.ok)RUNS=(await r.json()).runs||[]}catch(e){}}
let PT=null;async function poll(){clearTimeout(PT);try{const tok=(ls.get("gh_token")||ls.get("ev_gh_token")),h={accept:"application/vnd.github+json"};if(tok)h.authorization="Bearer "+tok;
 const r=await fetch("https://api.github.com/repos/"+REPO+"/actions/workflows/"+WF+"/runs?per_page=5",{headers:h});if(r.ok){const was=LIVE.some(x=>x.status!=="completed");LIVE=((await r.json()).workflow_runs||[]).filter(x=>!/一带一路/.test(x.display_title||""));if(was&&!LIVE.some(x=>x.status!=="completed"))await loadRuns();const d=document.getElementById("runs");if(d&&!VIEW)d.innerHTML=runsInner()}}catch(e){}
 if(!document.hidden)PT=setTimeout(poll,LIVE.some(x=>x.status!=="completed")?20000:90000)}
document.addEventListener("click",async e=>{const a=e.target.closest("[data-a]");if(!a)return;const[k,v]=a.dataset.a.split(/:(.*)/s);
 if(k==="tok"){if(v==="save"){const t=(document.getElementById("tok").value||"").trim();if(!/^(github_pat_|ghp_)/.test(t)){alert("令牌格式不对：应以 github_pat_ 开头");return}ls.set("gh_token",t)}else (ls.set("gh_token",null),ls.set("ev_gh_token",null))}
 else if(k==="rep"){VIEW='<p class="mute">读取中…</p>';render();try{const r=await fetch(RAW+v+"/REPORT.md");VIEW=r.ok?DOMPurify.sanitize(marked.parse(await r.text())):'<p class="mute">读不到报告（'+r.status+'）</p>'}catch(x){VIEW='<p class="mute">'+esc(x.message)+'</p>'}scrollTo(0,0)}
 else if(k==="back")VIEW=null;render()});
document.addEventListener("input",e=>{if(e.target.id==="req")ls.set("ev_draft",e.target.value)});
document.addEventListener("submit",async e=>{if(e.target.id!=="df")return;e.preventDefault();const m=document.getElementById("msg"),b=document.getElementById("go"),req=document.getElementById("req").value.trim();
 if(req.length<10){m.className="msg err";m.textContent="推演要求至少写 10 个字。";return}
 const rid=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z"+Math.random().toString(36).slice(2,6);b.disabled=true;m.className="msg";m.textContent="正在提交…";
 try{const r=await fetch("https://api.github.com/repos/"+REPO+"/actions/workflows/"+WF+"/dispatches",{method:"POST",headers:{authorization:"Bearer "+(ls.get("gh_token")||ls.get("ev_gh_token")),accept:"application/vnd.github+json","content-type":"application/json","x-github-api-version":"2022-11-28"},
  body:JSON.stringify({ref:"main",inputs:{requirement:req,title:document.getElementById("title").value.trim(),request_id:rid,max_rounds:String(document.getElementById("rounds").value||20)}})});
  if(r.status===204){m.className="msg ok";m.textContent="已提交，编号 "+rid+"。运行状态会显示在下面的推演记录里。";ls.set("ev_draft",null);setTimeout(poll,4000)}
  else{const t=await r.text();m.className="msg err";m.textContent=(r.status===401?"令牌无效或已过期，请断开后重新连接。":r.status===403||r.status===404?"令牌没有这个仓库的 Actions 写权限。":"提交失败（"+r.status+"）：")+t.slice(0,200)}}
 catch(x){m.className="msg err";m.textContent="网络错误："+x.message}b.disabled=false});
(async()=>{render();await loadRuns();render();poll()})();
</script>
</body>
</html>
