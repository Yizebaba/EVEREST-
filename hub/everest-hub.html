window.EV_SKILLS=[{"name": "everest-status", "desc": "查询珠峰（Everest）多源监测的当前状态：数据源是否正常、哪些台站停发、冰湖与河流水位、近期地震与崩塌、坡面雷达监测进度。用户问“珠峰现在怎么样”“哪些站停发”“Imja 水位多少”时使用。只监测，不预测。", "md": "---\nname: everest-status\ndescription: 查询珠峰（Everest）多源监测的当前状态：数据源是否正常、哪些台站停发、冰湖与河流水位、近期地震与崩塌、坡面雷达监测进度。用户问“珠峰现在怎么样”“哪些站停发”“Imja 水位多少”时使用。只监测，不预测。\n---\n\n# 珠峰监测现状查询\n\n## 取数顺序\n\n1. **有 EVEREST 连接器时**（工具名以 `everest_` 开头）直接调用：\n   - `everest_overview`：先看总览（数据源、停发设备、坡面进度、ADS-B）。\n   - `everest_offline`：停发设备清单（附最后数据时间）。\n   - `everest_water_levels`：水位站，可传 `station` 关键词（如 `Imja`、`Arun`、`Kodari`）。\n   - `everest_quakes`：USGS / EMSC / 尼泊尔国家地震中心，`limit` 默认 8。\n   - `everest_facets`：坡面监测基线进度或分级。\n   - `everest_source`：某个源的原始 JSON（evn、bipad、emsc、gibs、ioda、usgs、alerts、nsc、gdacs、doris、adsb）。\n   - `everest_station_history`：单站水位序列；`everest_alerts`：灾害警报；`everest_connectivity`：当地网络连通；\n     `everest_satellite_tracking`：DORIS 信标跟踪；`everest_air_traffic`：ADS-B；`everest_imagery`：最新云图链接；`everest_daily_brief`：日报。\n2. **没有连接器时**：读公开快照\n   `https://raw.githubusercontent.com/Yizebaba/everest-insar-pipeline/facet-live/rt.json`（每小时更新）和同分支的 `facet_status.json`。\n   停发判定：水位站超过 6 小时无数据；IO.EVN 最近 20 分钟完整度为 0；DORIS 12 小时内没被跟踪。\n\n## 回答规则\n\n- 时间一律换成北京时间（UTC+8），并写明数据汇总时间。\n- **只监测、不预测**：不说“会不会溃决/崩塌”，不给风险等级或概率。\n- 停报不等于正常；外部设备（尼泊尔水文局水位站、IO.EVN、DORIS）不归本平台维修，只报告状态。\n- “USGS landslide”是地震台网测到的大型崩塌，不是构造地震。\n- ADS-B 显示 0 架时说明：可能是附近没有接收站，不等于没有飞机。\n- 每条数字附来源（BIPAD、GEOFON、USGS、EMSC、IODA、GDACS、IGN/IDS）。\n\n## 相关页面\n\n- 总览：https://claude.ai/artifact/6heopu2wizEAFMJJLDs44H（“运行状态”“设备维护”标签）\n- 实时采集页：https://everest-facets.yizebaba.workers.dev/rt\n", "run": true, "example": "哪些站停发了？Imja 冰湖出口水位现在多少？", "desc_en": "Check the current state of Everest multi-source monitoring: data sources, offline stations, lake and river levels, recent quakes and collapses, facet radar watch progress. Monitoring only, no prediction."}, {"name": "everest-daily-brief", "desc": "生成珠峰监测日报：数据源状态、停发设备、近 24 小时地震与崩塌、灾害警报、水位越线、通信连通、DORIS 跟踪、坡面进度。用户说“出个日报”“今天珠峰情况汇总”“给我一份监测简报”时使用。只监测，不预测。", "md": "---\nname: everest-daily-brief\ndescription: 生成珠峰监测日报：数据源状态、停发设备、近 24 小时地震与崩塌、灾害警报、水位越线、通信连通、DORIS 跟踪、坡面进度。用户说“出个日报”“今天珠峰情况汇总”“给我一份监测简报”时使用。只监测，不预测。\n---\n\n# 珠峰监测日报\n\n## 取数\n\n1. 调用 `everest_daily_brief`（`hours` 默认 24；用户说“最近三天”就传 72）。\n2. 日报里有停发设备或越线水位站时，再调 `everest_station_history` 看那几个站的序列，写清最后数据时间。\n3. 有地震或崩塌时，调 `everest_quakes` 补全震级、位置和来源。\n4. 没有连接器时，读 `https://raw.githubusercontent.com/Yizebaba/everest-insar-pipeline/facet-live/rt.json` 自己汇总。\n\n## 格式\n\n- 标题写“EVEREST 监测日报 · 日期（北京时间）”，第一行写数据截至时间。\n- 分八段：数据源、停发设备、地震与崩塌、灾害警报、水位、通信、DORIS 信标、坡面雷达。没有内容的段写“无”，不要删段。\n- 每个数字附来源（BIPAD、GEOFON、USGS、EMSC、NSC、IODA、IDS/DORIS、GDACS）。\n- 结尾固定一句：只监测、不预测；停报不等于正常；外部设备不归本平台维修。\n\n## 不能做\n\n- 不写“可能溃决”“风险升高”之类的判断，不给概率。\n- 不加天气预报。\n", "run": true, "example": "给我一份今天的珠峰监测日报", "desc_en": "Generate an Everest monitoring brief: source status, offline equipment, quakes and collapses in the last 24 hours, hazard alerts, water levels over warning lines, connectivity, DORIS tracking and facet progress. Monitoring only, no prediction.", "example_en": "Give me today's Everest monitoring brief"}, {"name": "everest-lake-watch", "desc": "冰湖与河流水位查看：Imja、Tsho Rolpa 冰湖出口和 Dudh Koshi、Arun、Bhote Koshi 等河流水位站的最新水位、警戒/危险线、近几小时变化和是否停报。用户问“Imja 水位多少”“冰湖水位有没有变化”“哪个站停报了”时使用。", "md": "---\nname: everest-lake-watch\ndescription: 冰湖与河流水位查看：Imja、Tsho Rolpa 冰湖出口和 Dudh Koshi、Arun、Bhote Koshi 等河流水位站的最新水位、警戒/危险线、近几小时变化和是否停报。用户问“Imja 水位多少”“冰湖水位有没有变化”“哪个站停报了”时使用。\n---\n\n# 冰湖与河流水位\n\n## 取数\n\n1. `everest_water_levels`：全部站或按 `station` 关键词过滤，先看最新值、警戒/危险线、是否在报。\n2. `everest_station_history`：用户关心的站拉序列（`hours` 默认 24，最多 72），给出最高、最低、变化量。\n3. 有站停报时，调 `everest_connectivity` 看当地是否断网，作为可能原因之一写出来（只写“可能”，不下结论）。\n\n## 写法\n\n- 表格：站名、最新水位（m）、警戒线、危险线、24 小时变化、状态（在报/停报）、最后数据时间（北京时间）。\n- 门户状态（ABOVE WARNING / DANGER LEVEL）照原样转述，并注明“来自尼泊尔水文气象局门户”；对已停报的站要说明这个状态可能是旧的或设备故障造成的。\n- 不预测涨水或溃决。\n", "run": true, "example": "Imja 冰湖出口最近 24 小时水位有没有变化？", "desc_en": "Glacial lake and river levels: latest level, warning/danger lines, recent change and reporting status for Imja, Tsho Rolpa and the Dudh Koshi, Arun and Bhote Koshi stations.", "example_en": "Has the Imja lake outlet level changed in the last 24 hours?"}, {"name": "everest-quake-brief", "desc": "珠峰范围地震与大型崩塌简报：汇总 USGS、EMSC、尼泊尔国家地震中心的近期事件，标出 USGS 识别的崩塌/滑坡，并核对 IO.EVN 台站当时是否在线。用户问“最近有没有地震”“那次崩塌是什么时候”“珠峰附近震了吗”时使用。", "md": "---\nname: everest-quake-brief\ndescription: 珠峰范围地震与大型崩塌简报：汇总 USGS、EMSC、尼泊尔国家地震中心的近期事件，标出 USGS 识别的崩塌/滑坡，并核对 IO.EVN 台站当时是否在线。用户问“最近有没有地震”“那次崩塌是什么时候”“珠峰附近震了吗”时使用。\n---\n\n# 地震与崩塌简报\n\n## 取数\n\n1. `everest_quakes`，`limit` 默认 10；用户要更多就加大（最多 30）。\n2. `everest_offline` 看 IO.EVN 地震台（Pyramid）是否停发，停发要写出最后数据时间——台站停发时近场小事件可能漏记。\n3. 需要原始数据时用 `everest_source`，`key` 取 `usgs`、`emsc` 或 `nsc`。\n\n## 写法\n\n- 按时间倒序列出：北京时间、震级和类型、位置、来源。\n- 同一事件在多个目录里出现时合并成一行，并列出各目录给的震级。\n- USGS 类型为 `landslide` 的写“崩塌/滑坡（非构造）”。\n- 只陈述目录记录，不推测余震、不评估危险。\n", "run": true, "example": "最近一周珠峰附近有没有地震或崩塌？", "desc_en": "Brief on quakes and large collapses around Everest from USGS, EMSC and Nepal's NSC, flagging USGS landslides and checking whether IO.EVN was online.", "example_en": "Any quakes or collapses near Everest in the last week?"}, {"name": "everest-comms-check", "desc": "现场设备停发排查：把停发设备清单和当地网络连通（IODA）、DORIS 信标卫星跟踪、ADS-B 情况放在一起看，帮助判断是设备问题还是通信问题。用户问“为什么停发”“是不是断网了”“信标还在发吗”时使用。", "md": "---\nname: everest-comms-check\ndescription: 现场设备停发排查：把停发设备清单和当地网络连通（IODA）、DORIS 信标卫星跟踪、ADS-B 情况放在一起看，帮助判断是设备问题还是通信问题。用户问“为什么停发”“是不是断网了”“信标还在发吗”时使用。\n---\n\n# 停发排查\n\n## 取数\n\n1. `everest_offline`：停发设备和最后数据时间。\n2. `everest_connectivity`：萨加玛塔区 BGP 可达网段和主动探测，24 小时最低值。\n3. `everest_satellite_tracking`：DORIS 信标 EVEC 最近被跟踪的时间——信标自带电源和发射机，被跟踪说明当地有电、设备在发射。\n4. `everest_air_traffic`：可选，作为卢卡拉一带是否有活动的旁证（0 架不代表没有飞机）。\n\n## 判断写法（只列证据，不下结论）\n\n- 停发时间与断网时间重合 → “可能与当地断网有关”。\n- 网络正常而单个站停发 → “更可能是该设备或其上传链路的问题”。\n- 停发很久（几周以上）的站 → 提醒去“设备维护”标签登记或查看维修记录。\n- 外部设备（尼泊尔水文局水位站、IO.EVN、DORIS）不归本平台维修，只报告状态和联系渠道。\n", "run": true, "example": "为什么有几个水位站停发？是不是当地断网了？", "desc_en": "Offline-equipment check: puts offline stations next to local connectivity (IODA), DORIS beacon tracking and ADS-B to help tell equipment faults from communication outages.", "example_en": "Why are some gauges offline? Is the local network down?"}, {"name": "everest-evidence-pack", "desc": "为喜马拉雅（珠峰、Bhote Koshi、Trishuli、Dudh Koshi、Arun 等流域）的一次灾害事件整理多源证据时间线：地震台、水位站、网络连通、卫星过境与制图、官方通报。用户说“做一份某某事件的证据包/时间线/复盘”时使用。只记录事实，不判断责任、不预测。", "md": "---\nname: everest-evidence-pack\ndescription: 为喜马拉雅（珠峰、Bhote Koshi、Trishuli、Dudh Koshi、Arun 等流域）的一次灾害事件整理多源证据时间线：地震台、水位站、网络连通、卫星过境与制图、官方通报。用户说“做一份某某事件的证据包/时间线/复盘”时使用。只记录事实，不判断责任、不预测。\n---\n\n# 事件证据包\n\n把同一事件的各类独立信号对齐到一条时间线上，每条都带来源和时间戳。对象：保险/再保险理赔核对、水电业主、开发机构复盘。\n\n## 步骤\n\n1. **确定事件窗口**：用户给的时间地点；没有就先查 USGS（含 `landslide` 类）和 GDACS 找候选，确认后再做。窗口取事件前 24 小时到后 72 小时。\n2. **收集信号**（能取到的都取，取不到的写“缺失”）：\n   - 地震/崩塌：USGS 事件页（类型、震级、位置）；EMSC；尼泊尔国家地震中心。\n   - 地震台波形：IO.EVN（GEOFON，`fdsnws/dataselect`），给出事件前后振幅比和距离。\n   - 水位：BIPAD 相关站的读数、警戒线、停发时间点（停发本身就是信号）。\n   - 网络连通：IODA 对应地区的 BGP / 主动探测曲线有无骤降。\n   - 卫星：哥白尼目录里事件前后的 Sentinel-1/2 过境；Copernicus EMS 激活号、国际宪章激活号及产品时间。\n   - 官方与权威通报：政府灾情通报（伤亡、失踪）、GDACS 等级。\n   - 有 EVEREST 连接器时先用 `everest_quakes`、`everest_water_levels`、`everest_source` 取当前保存的数据。\n3. **整理成时间线表**：时间（北京时间 + UTC）｜信号｜数值｜来源链接｜可信度说明。\n4. **写明缺口**：哪些信号没有（例如西藏一侧无公开水文数据）、哪些是推断。\n5. **输出**：默认做成一份文档（Claude Docs）；用户要文件再给 .docx/.pdf。\n\n## 规则\n\n- 只陈述观测事实，不判断是否应赔付、是谁的责任，不做预测。\n- 每个数字都要有可点开的来源；没有核实的标“未核实”。\n- 地震台测到的崩塌信号要写清“非构造地震”。\n- 损失数字注明是“初步”还是“最终”，以及发布机构和日期。\n", "run": true, "example": "整理 2026-08-26 吉隆冰岩崩与 Bhote Koshi 洪水的多源证据时间线。", "desc_en": "Build a multi-source evidence timeline for a Himalayan disaster event (seismic station, gauges, connectivity, satellite passes and mapping, official bulletins). Facts only; no blame, no prediction."}, {"name": "everest-maintenance", "desc": "查看和登记 EVEREST 设备维护：设备台账、维修与保养记录、保养到期、停发设备。用户说“记一条维修”“哪些设备快到保养期”“新增一台设备”“设备维护提醒”时使用。", "md": "---\nname: everest-maintenance\ndescription: 查看和登记 EVEREST 设备维护：设备台账、维修与保养记录、保养到期、停发设备。用户说“记一条维修”“哪些设备快到保养期”“新增一台设备”“设备维护提醒”时使用。\n---\n\n# 设备维护\n\n数据在 EVEREST 总览页的共享数据库里（总览“设备维护”标签显示同一份数据）：\n`https://claude.ai/artifact/6heopu2wizEAFMJJLDs44H`，用 ArtifactData 工具读写。\n\n## 数据结构\n\n| 集合 | 内容 | 谁能写 |\n|---|---|---|\n| `mt_assets/<id>` | 设备：name, site, type, owner（自有/外部）, status（正常/故障/维修中/停用）, intervalDays, lastServiced（YYYY-MM-DD）, monitorKey, model, serial, location, notes | 参与者及以上 |\n| `mt_logs/<id>` | 记录：assetId, date, kind（巡检/保养/维修/故障/校准/更换部件/其他）, summary, parts, hours, cost, statusAfter | 参与者及以上 |\n| `mt_monitor/latest` | 外部台站在线状态（每小时自动写） | 仅所有者 |\n| `mt_reminder/last` | 每日 08:53 提醒的结果 | 仅所有者 |\n| `mt_settings/main` | leadDays：提前提醒天数（默认 14） | 参与者及以上 |\n\n## 常用操作\n\n- **到期判断**：下次到期 = lastServiced + intervalDays；已过期为“逾期”，leadDays 天内为“即将到期”；状态“停用”的不提醒。\n- **记一条维修**：`mt_logs` 新建文档（随机 id）；如果是保养/维修且日期晚于 lastServiced，同时更新该设备的 `lastServiced`；有“处理后状态”时更新 `status`。\n- **新增设备**：`mt_assets` 新建文档，至少有 name、site；外部设备 owner 填“外部”。\n- 写之前先 `get` 拿 version，写时带 `if_version`；不要覆盖别人刚改的内容。\n\n## 规则\n\n- 外部设备（尼泊尔水文局水位站、IO.EVN、DORIS）只报告停发，不归本平台维修。\n- 删除设备前先跟用户确认；已有记录保留。\n- 只监测、不预测。\n", "run": false, "example": "", "desc_en": "View and record EVEREST equipment maintenance: register, repair and service records, service due dates, offline equipment."}, {"name": "everest-hub-change", "desc": "修改并发布 EVEREST 总览页（claude.ai 上的珠峰监测总览）时的固定流程：先备份、再修改、浏览器自检、写复原记录、发布。用户要求改总览页、加标签、改文字或翻译时使用。", "md": "---\nname: everest-hub-change\ndescription: 修改并发布 EVEREST 总览页（claude.ai 上的珠峰监测总览）时的固定流程：先备份、再修改、浏览器自检、写复原记录、发布。用户要求改总览页、加标签、改文字或翻译时使用。\n---\n\n# 改总览页的流程\n\n总览页：`https://claude.ai/artifact/6heopu2wizEAFMJJLDs44H`，源文件在仓库 `hub/everest-hub.html`。\n\n## 必须遵守\n\n1. **可复原**：改之前把当前线上版本存一份（`hub/backup/` 或 Artifact 的历史版本），改完在 `hub/RESTORE.md` 加一条：改了什么、线上版本号、怎么回退（回退到哪个版本号或重新发布哪个备份）。\n2. **只监测、不预测**：页面上不出现预测、风险概率、预警发布字样。\n3. **不碰天气**：不加天气预报类内容。\n4. **秘钥不进聊天、不进页面**：凭证只放在 Cloudflare / GitHub 的机密里。\n5. **重计算不放 GitHub**：大的计算放在外部（openEO、Planetary Computer、Cloudflare）；GitHub 只跑小任务。\n6. **数据库规则**：发布时如果要改 `capabilities`，必须带上全部现有规则（见 `hub/capabilities.json`），只增不减。\n\n## 步骤\n\n1. 用 Artifact `read` 取线上最新版本，和 `hub/everest-hub.html` 对比；有差异以线上为准。\n2. 修改：用脚本做精确替换（每处替换先断言只出现一次），不要整页重写。\n3. 自检：语法检查所有 `<script>`；用 Playwright 打开（用假 THREE 和模拟数据库），确认标签、关键面板、弹窗正常，无报错；切英文检查没有中英混杂。\n4. 翻译：新加的中文界面文字同时加英文（短词放 EXS 整句表，长句放 DSTR）。\n5. 发布到同一个 URL；把新文件提交回仓库 `hub/`，写 RESTORE 记录。\n6. 回复用户：一句话说改了什么、线上版本号、怎么回退。\n", "run": false, "example": "", "desc_en": "Fixed procedure for changing and publishing the EVEREST overview page: back up, edit, self-check in a browser, write a restore note, publish."}];

else if(ac==="conf"){if(!REV){say("确认需要审核员模式（在社区页打开）");return}a.state="CONFIRMED";a.conf=1;a.h.push(tm+" 审核员确认")}
else if(ac==="res"){if(!REV){say("解除需要审核员模式（在社区页打开）");return}kbAdd(a,"RESOLVED");a.state="RESOLVED";a.h.push(tm+" 解除")}
else if(ac==="rej"){if(SH.on&&!REV){say("驳回需要审核权限");return}kbAdd(a,"REJECTED");a.state="REJECTED";a.h.push(tm+" 驳回")}
if(SH.on)SH.putAnom(+i,ac,{keep:"继续观察",up:"升级为 "+ST_AN[a.state],conf:"审核员确认",res:"解除",rej:"驳回"}[ac]);audit("异常："+ac,a.t,"现状态 "+ST_AN[a.state]);say("已记录：示例操作，真实决策要走决策策略和人工审核");render();return}
if(d.dk){FOCUS={type:"anom",ref:+d.dk};selK=null;render();return}
if(d.cb){NT=d.cb;PICK=null;FOCUS=null;render();return}
if(d.nt){NT=d.nt;PICK=null;render();return}
if(d.pk){PICK=PICK===d.pk?null:d.pk;render();return}
if(d.ar){const r=RN[+d.ar],L=nAtt(NODEI).repo;if(L.indexOf(r.n)<0){L.push(r.n);if(SH.on)SH.putAtt(NODEI,r.n);audit("关联仓库模块",nodes[NODEI].n,r.n)}say("已把「"+r.n+"」关联到「"+nodes[NODEI].n+"」");render();return}
if(d.lk){const sv=$("lksel").value;if(sv===""){say("没有可连接的节点");return}const j=+sv;EDG.add(ek(NODEI,j));if(SH.on)SH.putEdge(NODEI,j,true);audit("连接",nodes[NODEI].n,"↔ "+nodes[j].n);say("已连接："+nodes[NODEI].n+" ↔ "+nodes[j].n);render();return}
if(d.ul){EDG.delete(ek(NODEI,+d.ul));if(SH.on)SH.putEdge(NODEI,+d.ul,false);audit("断开连接",nodes[NODEI].n,"↔ "+nodes[+d.ul].n);say("已断开连接");render();return}
if(d.cm){FOCUS={type:"comm",ref:+d.cm};render();return}
if(d.ns){selectNode(+d.ns);return}
if(d.ol){setView(d.ol);return}
if(d.v){if(NODEI!=null&&view==="hub"&&d.v!=="hub"&&SATS.some(x=>x.id===d.v)){NT=d.v;FOCUS=null;PICK=null;render()}else setView(d.v);return}
if(d.close){if(FOCUS)FOCUS=null;else{selK=null;NODEI=null}render();return}
if(d.k){selK=selK===d.k?null:d.k;const sc=$("rows").scrollTop;render();$("rows").scrollTop=sc;measure();inval();return}
if(d.go){const i=STAGES.findIndex(s=>s.id===d.go);view="stages";Q="";selK="s"+i;render();return}
const keep=()=>{const sc=$("rows").scrollTop;render();$("rows").scrollTop=sc;measure();inval()};
if(d.ra){const i=+d.ra,r=RN[i];added.add(i);SH.addNode({g:G,stage:r.stage,st:"C",n:r.n,added:1,kind:kindOf(r.n)},{ra:i});say("已把「"+r.n+"」加入总框架，状态为候选。");keep();return}
if(d.rl){const k=+d.rl;links.has(k)?links.delete(k):links.add(k);say(links.has(k)?"已接入连接："+RN[REDG[k][0]].n+" → "+RN[REDG[k][1]].n:"已取消该连接");keep();return}
if(d.sa){const i=+d.sa,s=SUP[i];supAdded.add(i);SH.addNode({g:G,stage:s.stage,st:"C",n:s.n,added:1,kind:kindOf(s.n)},{sa:i});say("已把「"+s.n+"」加入总框架，状态为候选"+(s.w?"，注意："+s.w:"")+"。");keep();return}
if(d.a){SH.addNode({g:"新加入",stage:d.s,st:"C",n:d.a,added:1,kind:kindOf(d.a)});say("已加入「"+d.a+"」，状态为候选。");keep();return}});
document.addEventListener("change",e=>{const t=e.target,ds=t.dataset||{};
if(ds.rl){if(!(SH.on&&SH.own)){say("只有所有者能指派角色");render();return}const i=ds.rl.indexOf("|"),u=ds.rl.slice(0,i),f=ds.rl.slice(i+1),v=f==="domain"?t.value.trim():!!t.checked;audit("指派角色",u.slice(-6),f+" → "+v);SH.putRole(u,{[f]:v});return}
if(ds.tt){if(!GOVOK()){say(SH.on?"只有管理员能改时效目标":"只有审核员能改时效目标");render();return}const v=Math.max(1,+t.value||1);audit("改时效目标",ds.tt,TT[ds.tt]+" → "+v+" 分钟");TT[ds.tt]=v;saveG();render();return}
if(ds.gv){if(!GOVSTEW()){say(SH.on?"只有数据管理员（由所有者指派）能改治理登记":"只有审核员能改治理登记");render();return}const i=ds.gv.lastIndexOf("|"),k=ds.gv.slice(0,i),f=ds.gv.slice(i+1),g=GV[k]||(GV[k]={lic:"",xb:"未核对",sens:"未定"});audit("改治理登记",k,f+"："+(g[f]||"")+" → "+t.value);g[f]=t.value.trim();if(SH.on)SH.putGv(k,g);else saveG();render();return}
if(ds.kl){if(!REV){say("只有审核员能改真值标签");render();return}const e0=KB[+ds.kl];audit("改真值标签",e0.title,e0.lab+" → "+t.value);e0.lab=t.value;if(SH.on){SH.putKb(e0)}else saveK();render();return}});
document.addEventListener("input",e=>{if(e.target.id==="audq"){AQ=e.target.value;$("audlist").innerHTML=audRows()}});
$("q").addEventListener("input",e=>{Q=e.target.value;const sc=0;$("rows").innerHTML=curRows().length?curRows().map(rowHTML).join(""):'<div class="none">没有匹配项</div>';$("rows").scrollTop=sc;applyLang();measure();inval()});
$("cmd").addEventListener("keydown",e=>{if(e.key!=="Enter")return;const q=e.target.value.trim().toLowerCase();if(!q)return;
const hit=SATS.find(x=>rowsOf(x.id).some(r=>(r.t+r.s).toLowerCase().includes(q)));
if(hit){e.target.value="";view=hit.id;selK=null;FOCUS=null;Q=q;render();return}
const ni=nodes.findIndex(n=>(n.n+n.g).toLowerCase().includes(q));if(ni>=0){e.target.value="";selectNode(ni);return}
const ai=ANOM.findIndex(a=>(a.t+a.obj+a.place).toLowerCase().includes(q));if(ai>=0){e.target.value="";FOCUS={type:"anom",ref:ai};render();return}
say("没有找到匹配项")});
$("rows").addEventListener("scroll",()=>{measure();inval()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("pop").classList.remove("on");$("modal").classList.remove("on");if(selK){selK=null;render()}}});
$("cards").addEventListener("pointerover",e=>{const c=e.target.closest(".card");hover=c?c.dataset.c:null});
$("cards").addEventListener("pointerout",()=>{hover=null});
addEventListener("resize",fit);
document.addEventListener("visibilitychange",()=>{if(RM||paused)return;if(document.hidden)cancelAnimationFrame(raf);else raf=requestAnimationFrame(frame)});
GL=init3D();if(!GL)setTimeout(()=>toast("无法加载 3D（需要 WebGL），已切换为简化显示"),600);render();fit();if(RM){introT0=-1e9;inval()}else raf=requestAnimationFrame(frame);

shInit();
