# 事件证据包：Cloudflare Worker 发现新事件（或每 6 小时补一次）时改 events 分支的 trigger.txt 触发；结果写回 events 分支。
# 只做小量取数和画图（GEOFON 波形、目录查询、STAC 检索），重计算不在这里。
name: evidence
on:
  push:
    branches: [events]
    paths: [trigger.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evidence
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: events }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q obspy matplotlib
      - run: python3 tools/evidence_pack.py
      - name: Save
        run: |
          git config user.name "evidence"; git config user.email "actions@users.noreply.github.com"
          git add events index.json && git commit -qm "evidence $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin events && git push -q origin events && break; sleep 3; done
