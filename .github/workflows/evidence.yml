# 事件证据包：Cloudflare Worker 发现新事件（或每 6 小时补一次）时改 events 分支的 trigger.txt 触发；总览页有人工提交的证据时，每小时同步任务改 manual.json 也会触发。结果写回 events 分支。
# 只做小量取数和画图（GEOFON 波形、目录查询、STAC 检索），重计算不在这里。
name: evidence
on:
  push:
    branches: [events]
    paths: [trigger.txt, manual.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evidence
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: events }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q obspy matplotlib opentimestamps-client h5py
      - run: python3 tools/evidence_pack.py
        env:
          MONTANDON_API_TOKEN: ${{ secrets.MONTANDON_API_TOKEN }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          CF_RADAR_TOKEN: ${{ secrets.CF_RADAR_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      - name: Save
        run: |
          git config user.name "evidence"; git config user.email "actions@users.noreply.github.com"
          git add -A events index.json && git commit -qm "evidence $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin events && git push -q origin events && break; sleep 3; done
