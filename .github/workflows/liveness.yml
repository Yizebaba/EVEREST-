name: liveness
on:
  push:
    branches: [data-probe]
    paths: [".github/workflows/liveness.yml", "tools/liveness_check.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: data-probe}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install obspy
      - run: mkdir -p data/liveness && python tools/liveness_check.py
      - run: |
          git config user.name "liveness-bot"; git config user.email "liveness-bot@users.noreply.github.com"
          git add data/liveness && git commit -m "liveness check" || echo no change
          git pull --rebase origin data-probe && git push origin HEAD:data-probe
