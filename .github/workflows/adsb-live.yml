# 珠峰周边 ADS-B：Cloudflare 实时采集每 15 分钟改一次 adsb-live 分支的 trigger.txt 来触发；结果写回 adsb-live 分支的 adsb.json。
name: adsb-live
on:
  push:
    branches: [adsb-live]
    paths: [trigger.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adsb-live
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: adsb-live }
      - name: Fetch ADS-B
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python3 tools/adsb_fetch.py
      - name: Check EVEREST connector from outside
        run: |
          U=https://everest-facets.yizebaba.workers.dev/mcp
          curl -s -m 30 -X POST $U -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' > tl.json || echo '{}' > tl.json
          curl -s -m 30 -X POST $U -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"everest_daily_brief","arguments":{}}}' > db.json || echo '{}' > db.json
          python3 - <<'PY'
          import json,time
          def ld(f):
              try: return json.load(open(f))
              except Exception: return {}
          tl=ld('tl.json').get('result',{}).get('tools',[]);r=ld('db.json').get('result',{})
          t=(r.get('content') or [{}])[0].get('text','')
          json.dump({'at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'ok':bool(t) and not r.get('isError'),'tools':len(tl),'tool_names':[x['name'] for x in tl],'head':t[:600]},open('mcp_health.json','w'),ensure_ascii=False)
          PY
          rm -f tl.json db.json; cat mcp_health.json
      - name: Save
        run: |
          git config user.name "adsb-live"; git config user.email "actions@users.noreply.github.com"
          git add adsb.json mcp_health.json && git commit -qm "adsb $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin adsb-live && git push -q origin adsb-live && break; sleep 3; done
