# 网页提交的推演任务：每 5 分钟问一次 Worker 有没有排队的任务，有就派出 mirofish.yml（每个任务一次运行，用提交者自己的密钥）。
# 用 GitHub OIDC 身份证明是本仓库的工作流，不需要任何密钥。同时最多 3 个在跑。
name: mirofish-queue
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:
permissions:
  actions: write
  id-token: write
concurrency: { group: mirofish-queue, cancel-in-progress: false }
jobs:
  take:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Take queued jobs and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(curl -sf https://everest-facets.yizebaba.workers.dev/mf/job | jq -r '.queued // 0') || n=0
          echo "queued: $n"; [ "$n" = "0" ] && exit 0
          T=$(curl -sf -H "authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=everest-mf" | jq -r .value)
          curl -sf -XPOST -H "authorization: Bearer $T" -H "content-type: application/json" -d '{}' https://everest-facets.yizebaba.workers.dev/mf/take > take.json
          jq -c '.jobs[]' take.json | while read -r j; do
            id=$(jq -r .id <<<"$j"); echo "dispatch $id"
            gh workflow run mirofish.yml --repo "$GITHUB_REPOSITORY" --ref main -f job="$id" -f project="$(jq -r .project <<<"$j")" -f scope="$(jq -r .scope <<<"$j")" -f title="$(jq -r '.title // ""' <<<"$j")" -f max_rounds="$(jq -r .rounds <<<"$j")"
          done
