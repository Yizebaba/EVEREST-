# 真实云端干涉：用 main 分支的 cloud_insar_pipeline.py 在哥白尼 openEO 上算 23790 条带最新影像对，
# 并取回已完成任务的预览图和统计。结果推到 insar-out 分支（不改 main）。
name: insar-cloud
on:
  workflow_dispatch:
  push:
    branches: [data-probe]
    paths: [".github/workflows/insar-cloud.yml", "tools/insar_cloud_run.py"]
permissions:
  contents: write
concurrency: {group: insar-cloud, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: data-probe}
      - uses: actions/checkout@v4
        with: {ref: main, path: mainsrc}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q openeo rasterio matplotlib numpy requests && sudo apt-get install -y -q fonts-noto-cjk >/dev/null
      - name: restore previous outputs
        run: |
          mkdir -p out
          if git ls-remote --exit-code origin insar-out >/dev/null 2>&1; then git fetch -q --depth 1 origin insar-out && git archive FETCH_HEAD | tar -x -C out; fi
      - name: token file
        env: {OPENEO_REFRESH_TOKEN: "${{ secrets.OPENEO_REFRESH_TOKEN }}"}
        run: |
          d="$HOME/.local/share/openeo-python-client"; mkdir -p "$d"
          python -c "import json,os;r=os.environ['OPENEO_REFRESH_TOKEN'];
          try: v=json.dumps(json.loads(r))
          except Exception: v=r
          open(os.path.expanduser('~/.local/share/openeo-python-client/refresh-tokens.json'),'w').write(v)"
          chmod 600 "$d/refresh-tokens.json"
      - run: python tools/insar_cloud_run.py mainsrc out
      - if: always()
        run: |
          cd out && rm -rf .git && git init -q -b insar-out && git add -A
          git -c user.name=insar-bot -c user.email=insar-bot@users.noreply.github.com commit -qm "insar $(date -u +%FT%TZ)" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" insar-out
