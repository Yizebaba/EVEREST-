name: Sentinel-1 InSAR Autonomous Pipeline

on:
  schedule:
    - cron: '0 14,16,18 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_auto_coder:
        description: 'Whether to run LangGraph Auto-Coder Agent demonstration'
        required: false
        type: boolean
        default: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install rasterio matplotlib

      - name: Configure OpenEO refresh token
        env:
          OPENEO_REFRESH_TOKEN: ${{ secrets.OPENEO_REFRESH_TOKEN }}
        run: |
          if [ -z "$OPENEO_REFRESH_TOKEN" ]; then
            echo "OPENEO_REFRESH_TOKEN is not configured; cloud InSAR step will be skipped."
            exit 0
          fi
          mkdir -p "$HOME/.local/share/openeo-python-client"
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ["OPENEO_REFRESH_TOKEN"]
          try:
              parsed = json.loads(raw)
          except json.JSONDecodeError:
              parsed = raw
          path = Path.home() / ".local/share/openeo-python-client/refresh-tokens.json"
          path.write_text(json.dumps(parsed) if not isinstance(parsed, str) else parsed)
          path.chmod(0o600)
          PY

      - name: Run LangGraph Auto-Coder Agent
        if: ${{ github.event.inputs.run_auto_coder == 'true' }}
        run: |
          python auto_coder_agent.py

      - name: Execute Main Pipeline
        env:
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python pipeline.py

      - name: Run validated cloud InSAR pair
        env:
          OPENEO_REFRESH_TOKEN: ${{ secrets.OPENEO_REFRESH_TOKEN }}
        run: |
          if [ -z "$OPENEO_REFRESH_TOKEN" ]; then
            echo "OPENEO_REFRESH_TOKEN is not configured; skipping cloud InSAR."
            exit 0
          fi
          python cloud_insar_pipeline.py --output data/cloud_insar

      - name: Commit and Push Results & Auto-generated Code
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ models/ cloud_insar_pipeline.py
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(agent): commit auto-generated module and updated InSAR results" && git push)
