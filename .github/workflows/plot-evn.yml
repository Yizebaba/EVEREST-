name: plot-evn
on:
  push:
    branches: [data-probe]
    paths: [".github/workflows/plot-evn.yml", "tools/plot_evn.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: data-probe}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install obspy matplotlib
      - run: python tools/plot_evn.py
      - run: |
          git config user.name "plot-bot"; git config user.email "plot-bot@users.noreply.github.com"
          git add data/evn && git commit -m "EVN waveform plots" || echo no change
          git pull --rebase origin data-probe && git push origin HEAD:data-probe
