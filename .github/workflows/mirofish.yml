# MiroFish 群体智能推演（github.com/666ghj/MiroFish，AGPL-3.0，不改它的代码，只调用它的后端 API）。
# 用本平台真实数据自动生成种子材料并上传 → 构建知识图谱 → 双平台模拟 → ReportAgent 报告。推演要求由使用者自己写（网页表单或 Run workflow 表单）。
# 结果是“推演”，单独保存在 events 分支 mirofish/<时间>/，标注为推演，不进证据链。
# 一带一路（Yizebaba/BRI-Empower）的推演也在这里跑（project=bri）：种子文档从那个公开仓库读，结果放 events 分支 mirofish-bri/。
# 谁推演谁出密钥：网页提交的任务（job）用提交者自己的模型和 Zep 密钥——Worker 排队，mirofish-queue.yml 派出，本工作流用 GitHub OIDC 身份向 Worker 领取（领取后 Worker 立刻删除）。
# 只有仓库主人在 Actions 里手动运行（不填 job）时才用仓库 Secrets：LLM_API_KEY、LLM_BASE_URL、LLM_MODEL_NAME、ZEP_API_KEY。
# 计算主要在 LLM 和 Zep 的云端，运行器只做调度，不是重计算。
name: mirofish
run-name: "推演 ${{ inputs.project == 'bri' && '一带一路' || 'EVEREST' }} ${{ inputs.request_id || inputs.job }} · ${{ inputs.title }}"
on:
  workflow_dispatch:
    inputs:
      requirement: { description: "推演要求（你自己写；网页提交的任务不用填，会从 Worker 领取）", required: false, default: "", type: string }
      job: { description: "网页提交的任务编号（由 mirofish-queue.yml 填；密钥向 Worker 领取）", required: false, default: "", type: string }
      title: { description: "标题（可空）", required: false, default: "", type: string }
      request_id: { description: "网页生成的编号（可空）", required: false, default: "", type: string }
      project: { description: "everest = 珠峰；bri = 一带一路（种子文档取自 Yizebaba/BRI-Empower，共用本仓库的模型和 Zep 密钥）", required: false, default: "everest", type: string }
      scope: { description: "一带一路的国家：ISO3 代码，多个用逗号（最多 5 个）", required: false, default: "PAK", type: string }
      max_rounds: { description: "模拟轮数（MiroFish 建议先小于 40）", default: "20" }
      mirofish_ref: { description: "MiroFish 提交号（固定版本）", default: "7657031ac01184afe2cb220f5ee3545573b5e843" }
      report_only_run: { description: "只生成报告：上次运行的 run id（从它保存的模拟状态继续，不重跑模拟）", default: "" }
      report_only_sim: { description: "只生成报告：模拟编号 sim_xxx", default: "" }
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: mirofish-${{ inputs.job || 'owner' }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Inputs and keys (job = submitter's own keys; otherwise repo secrets)
        env:
          S_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          S_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          S_LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          S_ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          IN_JOB: ${{ inputs.job }}
          IN_REQ: ${{ inputs.requirement }}
          IN_TITLE: ${{ inputs.title }}
          IN_RID: ${{ inputs.request_id }}
          IN_PROJECT: ${{ inputs.project }}
          IN_SCOPE: ${{ inputs.scope }}
          IN_ROUNDS: ${{ inputs.max_rounds }}
        run: |
          mkdir -p mf_out
          python3 tools/mirofish_claim.py
      - name: Seed material from live EVEREST data + your requirement
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          if [ "$MF_PROJECT" = "bri" ]; then python3 tools/mirofish_seed_bri.py mf_in "$MF_SCOPE"; else python3 tools/mirofish_seed.py mf_in combined; fi
          cp -r mf_in mf_out/input
          [ "$MF_PROJECT" = "bri" ] && echo "MFP=mirofish-bri" >> $GITHUB_ENV || echo "MFP=mirofish" >> $GITHUB_ENV
          python3 -c "import json,os,time;json.dump({'id':os.environ.get('MF_RID') or '','project':os.environ.get('MF_PROJECT') or 'everest','scope':os.environ.get('MF_SCOPE') or '','title':os.environ.get('MF_TITLE_IN') or '','requirement':os.environ['MF_REQUIREMENT'],'started':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'run_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']},open('mf_out/request.json','w'),ensure_ascii=False,indent=1)"
      - uses: actions/setup-python@v5
        if: env.MISSING != '1'
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@v6
        if: env.MISSING != '1'
      - name: Install MiroFish backend (pinned)
        if: env.MISSING != '1'
        run: |
          git clone -q https://github.com/666ghj/MiroFish.git mf && cd mf && git checkout -q "${{ github.event.inputs.mirofish_ref }}"
          cd backend && uv sync --frozen || uv sync
      - name: Restore simulation state (report-only)
        if: env.MISSING != '1' && github.event.inputs.report_only_run != ''
        uses: actions/download-artifact@v4
        with:
          name: mirofish-state
          path: mf/backend/uploads
          run-id: ${{ github.event.inputs.report_only_run }}
          github-token: ${{ github.token }}
      - name: Start backend and run
        if: env.MISSING != '1'
        env:
          MF_REPORT_ONLY: ${{ github.event.inputs.report_only_sim }}
        run: |
          cd mf/backend
          printf 'LLM_API_KEY=%s\nLLM_BASE_URL=%s\nLLM_MODEL_NAME=%s\nZEP_API_KEY=%s\n' "$LLM_API_KEY" "$LLM_BASE_URL" "$LLM_MODEL_NAME" "$ZEP_API_KEY" > ../.env
          # 后端放进独立会话（setsid）：它或模拟进程按进程组发信号时，不会波及本步骤的 shell（10-15 第二次运行在模拟中途被 SIGTERM 杀掉，exit 143）
          setsid nohup uv run python run.py > ../../mf_out/backend.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5001/health && break; sleep 3; done
          cd ../..
          # 每分钟记录内存和最占内存的进程；每 10 分钟把已有产物推到 events 分支 mirofish/<开始时间>/（运行器意外退出也能留下线索）
          D="${MFP:-mirofish}/$(date -u +%Y%m%dT%H%M%SZ)"; echo "MFDIR=$D" >> $GITHUB_ENV
          ( while true; do { date -u +%FT%TZ; free -m | sed -n 2p; ps -eo rss,comm --sort=-rss | sed -n 2,4p | tr '\n' ' '; echo; } >> mf_out/sys.log; sleep 60; done ) > /dev/null 2>&1 & P1=$!
          ( n=0; while true; do sleep 600; n=$((n+1)); bash tools/mirofish_checkpoint.sh "$D" "checkpoint $n" || true; done ) > /dev/null 2>&1 & P2=$!
          python3 tools/mirofish_run.py mf_in mf_out "${MF_ROUNDS:-20}" || echo "RUNFAIL=1" >> $GITHUB_ENV
          kill $P1 $P2 2>/dev/null || true
          # 后端日志里的上游错误码写进 status.json（402 = 模型账户余额不足，401 = 密钥无效，429 = 限流）
          c=$(grep -o "status=[0-9][0-9][0-9]" mf_out/backend.log | tail -1 | cut -d= -f2); [ -n "$c" ] && python3 -c "import json,sys;p='mf_out/status.json';d=json.load(open(p));d['upstream_status']=int(sys.argv[1]);d['upstream_hint']={'402':'模型账户余额不足，需要充值','401':'模型密钥无效','429':'模型接口限流'}.get(sys.argv[1],'');json.dump(d,open(p,'w'),ensure_ascii=False,indent=1)" "$c" || true
          # 日志里不能有密钥
          for f in mf_out/backend.log mf_out/run.log; do [ -f "$f" ] && for k in "$LLM_API_KEY" "$ZEP_API_KEY"; do [ -n "$k" ] && sed -i "s|$k|***|g" "$f" || true; done; done
          rm -f mf/.env
      - name: Keep simulation state for a later report-only run (14 days)
        # 模拟状态（项目、模拟数据库、配置）在 mf/backend/uploads；图谱在 Zep 云端。报告失败（如余额不足）时，下次只需生成报告，不用重跑模拟
        if: always() && env.MISSING != '1'
        uses: actions/upload-artifact@v4
        with:
          name: mirofish-state
          path: mf/backend/uploads
          retention-days: 14
          if-no-files-found: ignore
      - name: Save to events branch (mirofish/<UTC time>/)
        if: always()
        run: |
          D="${MFDIR:-${MFP:-mirofish}/$(date -u +%Y%m%dT%H%M%SZ)}"
          bash tools/mirofish_checkpoint.sh "$D" "final"
          [ -n "${MF_JOB:-}" ] && python3 tools/mirofish_claim.py done "$D" || true
