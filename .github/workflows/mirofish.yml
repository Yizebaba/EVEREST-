# MiroFish 群体智能推演（github.com/666ghj/MiroFish，AGPL-3.0，不改它的代码，只调用它的后端 API）。
# 用本平台真实数据自动生成种子材料并上传 → 构建知识图谱 → 双平台模拟 → ReportAgent 报告。推演要求由使用者自己写（网页表单或 Run workflow 表单）。
# 结果是“推演”，单独保存在 events 分支 mirofish/<时间>/，标注为推演，不进证据链。
# 需要仓库 Secrets：LLM_API_KEY、LLM_BASE_URL、LLM_MODEL_NAME（任意 OpenAI 格式接口，MiroFish 推荐阿里百炼 qwen-plus）、ZEP_API_KEY（Zep Cloud）。
# 计算主要在 LLM 和 Zep 的云端，运行器只做调度，不是重计算。
name: mirofish
run-name: "推演 ${{ inputs.request_id }} · ${{ inputs.title || 'EVEREST' }}"
on:
  workflow_dispatch:
    inputs:
      requirement: { description: "推演要求（你自己写，必填；网页表单会填到这里）", required: true, type: string }
      title: { description: "标题（可空）", required: false, default: "", type: string }
      request_id: { description: "网页生成的编号（可空）", required: false, default: "", type: string }
      max_rounds: { description: "模拟轮数（MiroFish 建议先小于 40）", default: "20" }
      mirofish_ref: { description: "MiroFish 提交号（固定版本）", default: "7657031ac01184afe2cb220f5ee3545573b5e843" }
      report_only_run: { description: "只生成报告：上次运行的 run id（从它保存的模拟状态继续，不重跑模拟）", default: "" }
      report_only_sim: { description: "只生成报告：模拟编号 sim_xxx", default: "" }
permissions:
  contents: write
  actions: read
concurrency:
  group: mirofish
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets (only says whether each is set)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
        run: |
          miss=""
          for k in LLM_API_KEY LLM_BASE_URL LLM_MODEL_NAME ZEP_API_KEY; do if [ -z "${!k}" ]; then miss="$miss $k"; echo "$k: missing"; else echo "$k: set"; fi; done
          mkdir -p mf_out; echo "{\"missing\": \"$miss\"}" > mf_out/secrets_check.json
          if [ -n "$miss" ]; then echo "缺少：$miss"; echo "MISSING=1" >> $GITHUB_ENV; fi
      - name: Seed material from live EVEREST data + your requirement
        env:
          GH_TOKEN: "${{ github.token }}"
          MF_REQUIREMENT: ${{ inputs.requirement }}
          MF_TITLE_IN: ${{ inputs.title }}
          MF_RID: ${{ inputs.request_id }}
        run: |
          python3 tools/mirofish_seed.py mf_in combined && cp -r mf_in mf_out/input
          python3 -c "import json,os,time;json.dump({'id':os.environ.get('MF_RID') or '','title':os.environ.get('MF_TITLE_IN') or '','requirement':os.environ['MF_REQUIREMENT'],'started':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'run_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']},open('mf_out/request.json','w'),ensure_ascii=False,indent=1)"
      - uses: actions/setup-python@v5
        if: env.MISSING != '1'
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@v6
        if: env.MISSING != '1'
      - name: Install MiroFish backend (pinned)
        if: env.MISSING != '1'
        run: |
          git clone -q https://github.com/666ghj/MiroFish.git mf && cd mf && git checkout -q "${{ github.event.inputs.mirofish_ref }}"
          cd backend && uv sync --frozen || uv sync
      - name: Restore simulation state (report-only)
        if: env.MISSING != '1' && github.event.inputs.report_only_run != ''
        uses: actions/download-artifact@v4
        with:
          name: mirofish-state
          path: mf/backend/uploads
          run-id: ${{ github.event.inputs.report_only_run }}
          github-token: ${{ github.token }}
      - name: Start backend and run
        if: env.MISSING != '1'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          MF_REPORT_ONLY: ${{ github.event.inputs.report_only_sim }}
        run: |
          cd mf/backend
          printf 'LLM_API_KEY=%s\nLLM_BASE_URL=%s\nLLM_MODEL_NAME=%s\nZEP_API_KEY=%s\n' "$LLM_API_KEY" "$LLM_BASE_URL" "$LLM_MODEL_NAME" "$ZEP_API_KEY" > ../.env
          # 后端放进独立会话（setsid）：它或模拟进程按进程组发信号时，不会波及本步骤的 shell（10-15 第二次运行在模拟中途被 SIGTERM 杀掉，exit 143）
          setsid nohup uv run python run.py > ../../mf_out/backend.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5001/health && break; sleep 3; done
          cd ../..
          # 每分钟记录内存和最占内存的进程；每 10 分钟把已有产物推到 events 分支 mirofish/<开始时间>/（运行器意外退出也能留下线索）
          D="mirofish/$(date -u +%Y%m%dT%H%M%SZ)"; echo "MFDIR=$D" >> $GITHUB_ENV
          ( while true; do { date -u +%FT%TZ; free -m | sed -n 2p; ps -eo rss,comm --sort=-rss | sed -n 2,4p | tr '\n' ' '; echo; } >> mf_out/sys.log; sleep 60; done ) > /dev/null 2>&1 & P1=$!
          ( n=0; while true; do sleep 600; n=$((n+1)); bash tools/mirofish_checkpoint.sh "$D" "checkpoint $n" || true; done ) > /dev/null 2>&1 & P2=$!
          python3 tools/mirofish_run.py mf_in mf_out "${{ github.event.inputs.max_rounds || '20' }}" || echo "RUNFAIL=1" >> $GITHUB_ENV
          kill $P1 $P2 2>/dev/null || true
          # 后端日志里的上游错误码写进 status.json（402 = 模型账户余额不足，401 = 密钥无效，429 = 限流）
          c=$(grep -o "status=[0-9][0-9][0-9]" mf_out/backend.log | tail -1 | cut -d= -f2); [ -n "$c" ] && python3 -c "import json,sys;p='mf_out/status.json';d=json.load(open(p));d['upstream_status']=int(sys.argv[1]);d['upstream_hint']={'402':'模型账户余额不足，需要充值','401':'模型密钥无效','429':'模型接口限流'}.get(sys.argv[1],'');json.dump(d,open(p,'w'),ensure_ascii=False,indent=1)" "$c" || true
          # 日志里不能有密钥
          for f in mf_out/backend.log mf_out/run.log; do [ -f "$f" ] && for k in "$LLM_API_KEY" "$ZEP_API_KEY"; do [ -n "$k" ] && sed -i "s|$k|***|g" "$f" || true; done; done
          rm -f mf/.env
      - name: Keep simulation state for a later report-only run (14 days)
        # 模拟状态（项目、模拟数据库、配置）在 mf/backend/uploads；图谱在 Zep 云端。报告失败（如余额不足）时，下次只需生成报告，不用重跑模拟
        if: always() && env.MISSING != '1'
        uses: actions/upload-artifact@v4
        with:
          name: mirofish-state
          path: mf/backend/uploads
          retention-days: 14
          if-no-files-found: ignore
      - name: Save to events branch (mirofish/<UTC time>/)
        if: always()
        env:   # 只用来在推送前把日志里的密钥抹掉
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
        run: |
          D="${MFDIR:-mirofish/$(date -u +%Y%m%dT%H%M%SZ)}"
          bash tools/mirofish_checkpoint.sh "$D" "final"
