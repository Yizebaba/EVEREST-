# 一次性调查（只读 IGN 匿名 FTP）。查完即删。
name: doris-probe
on:
  push:
    branches: [data-probe]
    paths: [tools/doris_probe.py, .github/workflows/doris-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: data-probe}
      - run: sudo apt-get install -y -q ncompress >/dev/null || true
      - run: python3 tools/doris_probe.py doris.json
      - if: always()
        run: |
          mkdir _o && cp doris.json _o/ 2>/dev/null; cd _o && git init -q -b doris-probe && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" doris-probe
