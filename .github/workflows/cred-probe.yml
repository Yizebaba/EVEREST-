# 检查完整 InSAR 流程需要的授权（只报告有没有、能不能用，不输出密钥）。结果写到 probe-out 分支。
name: cred-probe
on:
  workflow_dispatch:
  push:
    branches: [data-probe]
    paths: [".github/workflows/cred-probe.yml", "tools/cred_probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: data-probe}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q openeo
      - env:
          OPENEO_REFRESH_TOKEN: ${{ secrets.OPENEO_REFRESH_TOKEN }}
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python tools/cred_probe.py cred.json
      - run: |
          mkdir _o && cp cred.json _o/ && cd _o && git init -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "cred probe"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
