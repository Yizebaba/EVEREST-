# 灾种扫描：按联合国减灾署 281 种灾害逐个查公开数据源（小量取数，不做重计算）。
# survey = 实测候选接口；scan = 每小时扫描并更新覆盖结果。结果写到 events 分支 hazards/ 目录。
name: hazards
on:
  workflow_dispatch:
    inputs:
      task: { description: "survey / scan / venues / cams / catalog / probe", default: "scan" }
      only: { description: "survey 只测这个前缀的来源（可空）", default: "" }
  schedule:
    - cron: "17 * * * *"
    - cron: "41 2 * * *"   # 每天一次：增量补齐 281 灾种的期刊排名（OpenAlex 额度按天）
permissions:
  contents: write
  actions: write
concurrency:
  group: hazards
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run
        env:
          TASK: ${{ github.event.inputs.task || (github.event.schedule == '41 2 * * *' && 'venues') || 'scan' }}
          SURVEY_ONLY: ${{ github.event.inputs.only }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          CF_RADAR_TOKEN: ${{ secrets.CF_RADAR_TOKEN }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out; git fetch -q origin events || true; pip install -q pillow || true
          set +e
          if [ "$TASK" = "survey" ]; then python3 tools/source_survey.py out/survey.json > out/run.log 2>&1
          elif [ "$TASK" = "venues" ]; then git show origin/events:hazards/venues.json > prev_venues.json 2>/dev/null; python3 tools/venue_rank.py out/venues.json prev_venues.json > out/venues.log 2>&1; echo "exit=$?" >> out/venues.log; python3 tools/venues_report.py out/venues.json out/HAZARD_VENUES.md >> out/venues.log 2>&1; tail -40 out/venues.log; exit 0
          elif [ "$TASK" = "cams" ]; then python3 tools/webcams.py out > out/cams.log 2>&1; cat out/cams.log; exit 0
          elif [ "$TASK" = "probe" ]; then python3 tools/gdelt_news.py out > out/probe_gdelt.log 2>&1; cat out/probe_gdelt.log; python3 - <<'PY' > out/probe.log 2>&1; cat out/probe.log; exit 0
          import re,urllib.request
          s=open("cf-worker/src/rt.js").read(); a=s.index("export const IMG"); b=s.index("};",a)
          X=[("eum_airmass","https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.3.0&request=GetMap&styles=&crs=EPSG:4326&BBOX=25.5,82.5,31.0,90.5&WIDTH=640&HEIGHT=440&format=image/jpeg&layers=msg_iodc:rgb_airmass"),("eum_ir108","https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.3.0&request=GetMap&styles=&crs=EPSG:4326&BBOX=25.5,82.5,31.0,90.5&WIDTH=640&HEIGHT=440&format=image/png&layers=msg_iodc:ir108")]
          for k,u in re.findall(r'(\w+): "([^"]+)"', s[a:b])+X:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={"user-agent":"everest-probe"}),timeout=60); d=r.read()
                  open(f"out/probe_{k}.jpg","wb").write(d); print(k, r.status, r.headers.get("content-type"), len(d))
              except Exception as e: print(k, "ERR", e)
          try:
              c=urllib.request.urlopen("https://view.eumetsat.int/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities&namespace=msg_iodc",timeout=90).read().decode("utf-8","ignore")
              print(sorted(set(re.findall(r"<Name>(msg_iodc:[^<]+)</Name>",c))))
          except Exception as e: print("eumetsat caps", e)
          PY
          elif [ "$TASK" = "catalog" ]; then python3 tools/catalog.py out 2>&1 | tee out/catalog.log; exit 0
          else python3 tools/hazard_scan.py out > out/run.log 2>&1; python3 tools/webcams.py out > out/cams.log 2>&1 || true; python3 tools/catalog.py out > out/catalog.log 2>&1 || true; python3 tools/gdelt_news.py out >> out/catalog.log 2>&1 || true; python3 tools/sat_catalog.py out >> out/catalog.log 2>&1 || true; fi
          echo "exit=$?" >> out/run.log; tail -40 out/run.log
      - name: Save to events branch
        if: always()
        run: |
          git config user.name "hazards"; git config user.email "actions@users.noreply.github.com"
          git fetch -q origin events && git worktree add -q ev origin/events && mkdir -p ev/hazards && cp out/* ev/hazards/
          cd ev && git add hazards && git commit -qm "hazards $TASK $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin events && git push -q origin HEAD:events && break; sleep 3; done
          # 有新的事件候选时，立刻让证据包工作流跑一次（推送用的是 GITHUB_TOKEN，不会自动触发别的工作流）
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q scan_events.json; then gh workflow run evidence.yml --ref events -R "$GITHUB_REPOSITORY" || true; fi
        env:
          TASK: ${{ github.event.inputs.task || (github.event.schedule == '41 2 * * *' && 'venues') || 'scan' }}
          GH_TOKEN: ${{ github.token }}
      - name: Page docs for the connector (events hub/ops.json, hub/mt_monitor.json)
        # 运行记录和设备在线状态要用 GitHub Actions 接口，Worker 拿不到，所以在这里生成，连接器 everest_events(id="page:ops") 直接读。
        if: always()
        env:
          TASK: ${{ github.event.inputs.task || (github.event.schedule == '41 2 * * *' && 'venues') || 'scan' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$TASK" = "scan" ] || exit 0
          python3 tools/hub_sync.py hub_out > hub_out.log 2>&1 || true; tail -12 hub_out.log
          cd ev && git pull -q --rebase origin events || true; mkdir -p hub
          [ -f ../hub_out/live_ops.json ] && cp ../hub_out/live_ops.json hub/ops.json
          [ -f ../hub_out/mt_monitor.json ] && cp ../hub_out/mt_monitor.json hub/mt_monitor.json
          git add hub && git commit -qm "hub docs $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin events && git push -q origin HEAD:events && break; sleep 3; done
