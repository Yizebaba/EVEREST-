# 一次性试算（只当发请求的客户端，计算在微软 Planetary Computer Data API 上）。正式运行放 Cloudflare Worker。
name: pc-trial
on:
  push:
    branches: [data-probe]
    paths: ["cf-worker/trial.mjs", "cf-worker/src/pc.js", ".github/workflows/pc-trial.yml"]
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: data-probe}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: cd cf-worker && node trial.mjs
      - if: always()
        run: |
          mkdir _o && cp cf-worker/trial.json _o/ 2>/dev/null; cd _o && git init -q -b pc-trial && git add -A
          git -c user.name=trial -c user.email=trial@users.noreply.github.com commit -qm trial && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pc-trial
