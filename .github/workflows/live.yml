# 珠峰实时采集：每 10 分钟采集一次，状态存在 live-data 分支（只保留最新一个提交，不堆历史），并发布到 GitHub Pages。
name: live
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [data-probe]
    paths: [".github/workflows/live.yml", "tools/live_collect.py", "site/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: data-probe}
      - name: restore state
        run: |
          mkdir -p state
          if git ls-remote --exit-code origin live-data >/dev/null 2>&1; then
            git fetch -q --depth 1 origin live-data
            git archive FETCH_HEAD state | tar -x || true
          fi
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install obspy numpy
      - run: python tools/live_collect.py state
      - name: save state (single orphan commit)
        run: |
          rm -rf _out && mkdir -p _out/site/data && cp -r state _out/ && cp site/index.html _out/site/ && cp state/*.json _out/site/data/
          cd _out && git init -q -b live-data && git add -A
          git -c user.name="live-bot" -c user.email="live-bot@users.noreply.github.com" commit -q -m "live $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-data
      - uses: actions/upload-pages-artifact@v3
        with: {path: _out/site}
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
